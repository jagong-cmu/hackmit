name: Brownmellon
options:
  bundleIdPrefix: com.brownmellon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Brownmellon:
    type: application
    platform: iOS
    sources:
      - path: Brownmellon
    info:
      path: Brownmellon/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Brownmellon uses the glasses camera to scan appointment cards and read documents aloud."
        NSMicrophoneUsageDescription: "Brownmellon listens for \"Hey Brownmellon\" to respond to voice commands."
        # Points the app at the deployed backend by default — required on a
        # physical device, since "localhost" there means the phone itself,
        # not your Mac. Override at build time if you're running `vercel dev`
        # locally instead (see VisionBackendClient.baseURL / README.md).
        BROWNMELLON_BACKEND_URL: https://backend-five-dusky-36.vercel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brownmellon.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

# Note (Workstream B): this project intentionally has NO external package
# dependencies yet. The real Meta DAT SDK belongs to the GlassesSession
# implementation, which is shared-foundation work (see PRD.md), not owned
# by this workstream. Everything here is built and run against
# MockGlassesSession / MockCalendarService until that lands and this
# project.yml gets a `packages:` entry for it.
#
# Regenerate the .xcodeproj after any change to this file:
#   cd ios && xcodegen generate
