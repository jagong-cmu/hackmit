name: Brownmellon
options:
  bundleIdPrefix: com.brownmellon
  deploymentTarget:
    iOS: "17.2"   # floor set by the MWDAT frameworks
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Free "Personal Team" — enough to sideload onto our own phones (PRD §
    # Deployment). Teammates building to their own phone: put your team ID
    # here locally (Xcode → Settings → Accounts shows it) and don't commit it.
    DEVELOPMENT_TEAM: 3MNSW98DSV
    CODE_SIGN_STYLE: Automatic

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  # Meta Wearables Device Access Toolkit. Package.swift only exists on tagged
  # releases (not main), and Meta's own sample pins exactVersion — do the same.
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0

targets:
  Brownmellon:
    type: application
    platform: iOS
    sources:
      - path: Brownmellon
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    info:
      path: Brownmellon/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Brownmellon uses the glasses camera to scan appointment cards and read documents aloud."
        NSMicrophoneUsageDescription: "Brownmellon listens for \"Hey Dojo\" to respond to voice commands."
        NSSpeechRecognitionUsageDescription: "Brownmellon transcribes what you say after \"Hey Dojo\" so it can act on it. Recognition runs on-device."
        NSBluetoothAlwaysUsageDescription: "Needed to connect to your Ray-Ban Meta glasses."
        # --- Meta DAT requirements (mirrors the SDK's getting-started guide) ---
        # Meta AI hands registration/permission results back via this scheme.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [brownmellon]
        LSApplicationQueriesSchemes: [fb-viewapp]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        # `audio` keeps the "Hey Dojo" mic listener alive when the phone is in
        # a pocket — PRD § Deployment lists this as the open risk to test first.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, external-accessory, audio]
        MWDAT:
          AppLinkURLScheme: "brownmellon://"
          # "0" = Developer Mode (enabled in the Meta AI app), which is all a
          # sideloaded hackathon build needs. A real MetaAppID/ClientToken from
          # the Wearables Developer Center is only required for release channels.
          MetaAppID: "0"
        # Points the app at the deployed backend by default — required on a
        # physical device, since "localhost" there means the phone itself,
        # not your Mac. Override at build time if you're running `vercel dev`
        # locally instead (see VisionBackendClient.baseURL / README.md).
        BROWNMELLON_BACKEND_URL: https://backend-five-dusky-36.vercel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brownmellon.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

  BrownmellonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrownmellonTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brownmellon.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Brownmellon

schemes:
  Brownmellon:
    build:
      targets:
        Brownmellon: all
        BrownmellonTests: [test]
    test:
      targets:
        - BrownmellonTests

# GoogleSignIn is here because GoogleCalendarService (Core/) needs it. The
# real Meta DAT SDK belongs to the GlassesSession implementation — not yet
# built — the app still runs against MockGlassesSession until that lands
# and this file gets a second `packages:` entry for it.
#
# GoogleCalendarService itself isn't usable yet either — it needs a Google
# Cloud OAuth client ID that doesn't exist yet (PRD § Deployment).
# MockCalendarService is still what's actually wired up in BrownmellonApp.
#
# Regenerate the .xcodeproj after any change to this file:
#   cd ios && xcodegen generate
